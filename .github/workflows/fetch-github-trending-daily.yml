name: Fetch GitHub trending AI repos (daily)

# Populates the github_trending_runs/github_trending_repos tables for the
# "daily" cadence — see scripts/fetch-github-trending.ts's header comment.
# Separate from fetch-trends.yml's "repo" category, which is a continuously
# growing feed rather than a snapshot.
on:
  schedule:
    # 13:30 UTC daily — 30 min after fetch-trends.yml so the two don't
    # contend for the same GitHub Search API rate limit at once.
    - cron: "30 13 * * *"
  workflow_dispatch: {} # manual "run now" from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Fetch today's trending AI repos
        run: npm run github-trending:fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRENDING_CADENCE: daily
          # Auto-provided by Actions — raises the Search API's rate limit,
          # no setup needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
